spring.application.name=ehe-site-service
server.port=8081
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ehe}
spring.datasource.username=${DATABASE_USER:ehe}
spring.datasource.password=${DATABASE_PASSWORD}
ehe.issuer=${OIDC_ISSUER:http://localhost:8180/realms/ehe}
ehe.jwk-uri=${OIDC_JWK_URI:http://localhost:8180/realms/ehe/protocol/openid-connect/certs}
ehe.audience=ehe-site-api
ehe.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176}
ehe.demo=${EHE_DEMO:false}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
